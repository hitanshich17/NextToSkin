# Local development environment for NextToSkin.
# Everything runs on your machine for free. AWS is only used later for deployment.
#   docker compose up --build
name: skinvidhi

services:
  postgres:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 with the pgvector extension
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skinvidhi}
      POSTGRES_USER: ${POSTGRES_USER:-skinvidhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skinvidhi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skinvidhi} -d ${POSTGRES_DB:-skinvidhi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Emulates S3 (label images) and SQS (scan job queue) locally.
  # Newer LocalStack images may require a free auth token: set LOCALSTACK_AUTH_TOKEN in .env.
  # Kafka in KRaft mode (no ZooKeeper): one broker for local development. Catalog events, docs/events.md.
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # Containers reach the broker as kafka:29092; your machine (tests, scripts) as localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by the service that owns them
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./services/ai-service
      additional_contexts:
        schemas: ./schemas            # event schemas shared with the catalog service
    environment:
      APP_ENV: local
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      READ_MODEL_URL: postgresql://${POSTGRES_USER:-skinvidhi}:${POSTGRES_PASSWORD:-skinvidhi_dev_password}@postgres:5432/recommender
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  core-api:
    build: ./services/core-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skinvidhi}
      DB_USER: ${POSTGRES_USER:-skinvidhi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-skinvidhi_dev_password}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
