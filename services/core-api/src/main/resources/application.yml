spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skinvidhi}
    username: ${DB_USER:skinvidhi}
    password: ${DB_PASSWORD:skinvidhi_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                    # an event counts as sent only when every in-sync replica has it
      properties:
        enable.idempotence: true   # retries never write the same event twice to the topic
        max.block.ms: 5000         # don't wait a minute for a missing broker; the relay retries later
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nexttoskin:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 5s
  open-meteo:
    geocoding-url: https://geocoding-api.open-meteo.com/v1/search
    forecast-url: https://api.open-meteo.com/v1/forecast
    air-quality-url: https://air-quality-api.open-meteo.com/v1/air-quality
    connect-timeout: 2s
    read-timeout: 5s
    cache-for: 24h
